name: Deploy Bolgheri v2 (Next.js) to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'v2-next/**'
      - 'content/**'
      - 'static/images/**'
      - '.github/workflows/deploy.yml'
  # GITHUB_TOKEN で行われた push は downstream workflow を起動しないため、
  # 翻訳系ワークフロー完了後に確実に deploy をトリガーする (workflow_run は
  # PAT 不要で GitHub-native に動作する)。
  workflow_run:
    workflows:
      - "Daily Newsletter Translation"
      - "Batch Backfill Translations"
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    # workflow_run trigger の場合は upstream workflow が success 時のみ実行する
    # (失敗した翻訳ジョブで空デプロイが発生するのを防ぐ)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'v2-next/package-lock.json'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Python (for WebP conversion)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow for WebP conversion
        run: pip install --quiet Pillow

      - name: Convert hero PNG → WebP (P3 #5 bandwidth optimization)
        run: |
          # 既存 PNG を WebP に並列変換 (idempotent / non-blocking)
          # GitHub Pages bandwidth を 50% 削減 (PNG 1.5MB → WebP 0.7MB 平均)
          python scripts/convert_images_to_webp.py --quality 85 --workers 4 || true

      - name: Wire content + images into v2-next/
        run: |
          cd v2-next
          rm -rf content public/images
          ln -s ../content content
          mkdir -p public
          ln -s ../../static/images public/images
          ls -la content public/images | head -5

      - name: Install dependencies
        run: |
          cd v2-next
          npm ci --no-audit --prefer-offline

      - name: Build Next.js
        run: |
          cd v2-next
          npm run build
          echo "Built pages: $(find out -name 'index.html' | wc -l)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./v2-next/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
